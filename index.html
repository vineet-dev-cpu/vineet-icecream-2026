<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deepali 🍦</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#ffe3ec,#fff3d6);font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
    color:#5a2a3c;text-align:center;padding:20px;overflow:hidden}
  .page{display:none;flex-direction:column;align-items:center;gap:18px;max-width:420px;animation:pop .5s ease}
  .page.active{display:flex}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  .emoji{font-size:90px;animation:bounce 1.6s infinite}
  @keyframes bounce{50%{transform:translateY(-14px) rotate(6deg)}}
  h1{font-size:2rem;line-height:1.3}
  p{font-size:1.1rem}
  .btns{display:flex;gap:14px;margin-top:10px;position:relative;height:56px;align-items:center}
  button{font:inherit;font-size:1.1rem;border:0;border-radius:999px;padding:12px 28px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .15s}
  button:active{transform:translateY(2px)}
  #yes{background:#ff6b9a;color:#fff}
  #no{background:#fff;color:#5a2a3c}
  .heart{position:fixed;bottom:-30px;font-size:24px;animation:float linear forwards;pointer-events:none}
  @keyframes float{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
</style>
</head>
<body>

<section class="page active" id="p1">
  <div class="emoji">🍦</div>
  <h1>Deepali…<br>kal ice cream khane chalogi canteen? 🥺</h1>
  <p>Meri treat nahi hai, but company meri hai 😌</p>
  <div class="btns">
    <button id="yes">Haan chalungi! 💖</button>
    <button id="no">Nahi 🙈</button>
  </div>
</section>

<section class="page" id="p2">
  <div class="emoji">🥰</div>
  <h1>Thank you!<br>Chalo milte hai kal 🍨</h1>
  <p>Canteen mein, ice cream pe. Late mat hona 😜</p>
</section>

<script>
  const $ = id => document.getElementById(id);
  const no = $('no');

  // "No" button runs away
  function dodge(){
    no.style.position='fixed';
    no.style.left = Math.random()*(innerWidth-no.offsetWidth-20)+10+'px';
    no.style.top  = Math.random()*(innerHeight-no.offsetHeight-20)+10+'px';
  }
  no.addEventListener('mouseenter',dodge);
  no.addEventListener('touchstart',e=>{e.preventDefault();dodge()});
  no.addEventListener('click',dodge);

  function hearts(){
    for(let i=0;i<30;i++){
      const h=document.createElement('div');
      h.className='heart';
      h.textContent=['💖','🍦','✨','💕'][i%4];
      h.style.left=Math.random()*100+'vw';
      h.style.animationDuration=(3+Math.random()*3)+'s';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),6500);
    }
  }

  $('yes').addEventListener('click',()=>{
    $('p1').classList.remove('active');
    $('p2').classList.add('active');
    hearts();
  });
</script>
</body>
</html>
